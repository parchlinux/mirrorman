<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0c1420"/>
      <stop offset="1" stop-color="#1a2332"/>
    </linearGradient>
    <linearGradient id="mirror" x1="24" y1="104" x2="104" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5E62"/>
      <stop offset="0.35" stop-color="#FF9966"/>
      <stop offset="0.70" stop-color="#38ef7d"/>
      <stop offset="1" stop-color="#11998e"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00EAFF"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- squircle background -->
  <rect x="3" y="3" width="122" height="122" rx="42" fill="url(#bg)"/>
  <rect x="3" y="3" width="122" height="122" rx="42" fill="none" stroke="#38ef7d" stroke-opacity="0.2" stroke-width="1"/>

  <!-- speed / network pulse rings -->
  <circle cx="27" cy="101" r="50" fill="none" stroke="#38ef7d" stroke-opacity="0.10" stroke-width="2"/>
  <circle cx="27" cy="101" r="37" fill="none" stroke="#38ef7d" stroke-opacity="0.16" stroke-width="2"/>

  <!-- angled mirror glass pane -->
  <g transform="rotate(-16 64 64)">
    <rect x="26" y="24" width="76" height="80" rx="16" fill="url(#mirror)"/>
    <rect x="26" y="24" width="76" height="80" rx="16" fill="url(#glassSheen)"/>
    <path d="M34 100 L56 26 L66 26 L44 100 Z" fill="#ffffff" fill-opacity="0.16"/>
  </g>

  <!-- Code brackets symbol </ > (Developer edition) -->
  <path d="M42 50 L30 64 L42 78" stroke="#0c1420" stroke-opacity="0.4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M42 50 L30 64 L42 78" stroke="url(#codeGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <path d="M86 50 L98 64 L86 78" stroke="#0c1420" stroke-opacity="0.4" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M86 50 L98 64 L86 78" stroke="url(#codeGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <path d="M72 44 L56 84" stroke="#0c1420" stroke-opacity="0.4" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M72 44 L56 84" stroke="url(#codeGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
</svg>
