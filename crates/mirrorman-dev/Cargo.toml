[package]
name = "mirrorman-dev"
version = "0.6.0"
edition = "2021"

[[bin]]
name = "mirrorman-dev"
path = "src/main.rs"

[dependencies]
mirrorman-core = { path = "../mirrorman-core" }
gtk4 = { version = "0.9", features = ["v4_16"] }
adw = { version = "0.7", package = "libadwaita", features = ["v1_6"] }
glib = "0.20"
async-channel = "2"
