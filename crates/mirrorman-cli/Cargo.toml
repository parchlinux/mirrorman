[package]
name = "mirrorman-cli"
version = "0.5.1"
edition = "2021"

[[bin]]
name = "mirrorman-cli"
path = "src/main.rs"

[dependencies]
mirrorman-core = { path = "../mirrorman-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
