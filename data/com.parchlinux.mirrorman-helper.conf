<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="com.parchlinux.mirrorman.Helper"/>
    <allow send_destination="com.parchlinux.mirrorman.Helper"/>
  </policy>
  <policy context="default">
    <deny send_destination="com.parchlinux.mirrorman.Helper" send_type="signal"/>
    <allow send_destination="com.parchlinux.mirrorman.Helper"
           send_interface="com.parchlinux.mirrorman.Helper"
           send_type="method_call"/>
  </policy>
</busconfig>
